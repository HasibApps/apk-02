name: Build APK

on:
  push:
    branches:
      - 'arena/616ea1c3-apk-02'
    paths:
      - 'Pdf_g_v04.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Extract Android project
        run: unzip -q Pdf_g_v04.zip -d android-project
      # The ZIP uses an invalid Tesseract coordinate and omits its JitPack repository.
      - name: Fix Tesseract dependency in extracted project
        working-directory: android-project
        run: |
          sed -i 's/cz.adaptive:tesseract4android:4.7.0/cz.adaptech.tesseract4android:tesseract4android:4.7.0/' app/build.gradle.kts
          sed -i '/dependencyResolutionManagement {/,/^}/ s/mavenCentral()/mavenCentral()\n    maven { url = uri("https:\/\/jitpack.io") }/' settings.gradle.kts
      - name: Create debug signing key
        working-directory: android-project
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
      - name: Build debug APK
        working-directory: android-project
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/build.log").read(); p=s.find("FAILURE: Build failed"); s=(s[p:p+12000] if p>=0 else s[-12000:]); print("::error title=Gradle build failed::"+s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' 
            { echo '### Gradle build failure'; echo '```'; tail -100 "$RUNNER_TEMP/build.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Gallery-debug
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pdf-gallery-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp android-project/app/build/outputs/apk/debug/app-debug.apk PDF-Gallery-debug.apk
          gh release create "$tag" PDF-Gallery-debug.apk \
            --target "$GITHUB_SHA" \
            --title "PDF Gallery debug build ${GITHUB_RUN_ID}" \
            --notes "Debug-signed APK built from Pdf_g_v04.zip. The signing key is generated for this run, so it cannot update APKs signed with a different key. This is not a production release." \
            --prerelease
