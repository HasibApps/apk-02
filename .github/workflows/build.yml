name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
      - "arena/**"
    paths-ignore:
      - "**.md"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "বিল্ড শেষে GitHub Release-এ আপলোড করবে?"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager \( -type f -o -type l \) 2>/dev/null | head -1 || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi
          ls "$SDK_ROOT/platforms" || true

      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Read app metadata
        id: meta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re

          txt = pathlib.Path("app/build.gradle.kts").read_text()
          def find(pat, default=""):
              m = re.search(pat, txt)
              return m.group(1) if m else default

          app_id = find(r'applicationId\s*=\s*"([^"]+)"', "com.hasib.pdfgallery")
          ver_name = find(r'versionName\s*=\s*"([^"]+)"', "2.0.0")
          ver_code = find(r'versionCode\s*=\s*(\d+)', "2")
          min_sdk = find(r'minSdk\s*=\s*(\d+)', "24")
          target_sdk = find(r'targetSdk\s*=\s*(\d+)', "36")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"app_id={app_id}\n")
              out.write(f"version_name={ver_name}\n")
              out.write(f"version_code={ver_code}\n")
              out.write(f"min_sdk={min_sdk}\n")
              out.write(f"target_sdk={target_sdk}\n")

          print(f"App: {app_id} v{ver_name} (versionCode {ver_code}), SDK {min_sdk}->{target_sdk}")
          PY

      - name: Prepare signing keystore
        id: ks
        # Priority: GitHub Secrets (KEYSTORE_BASE64) -> versioned signing/release-keystore.b64.
        # Keeps the exact same signing certificate across all builds so updates install in-place.
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE || 'PKCS12' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'PdfGalleryHasib2026!Key' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pdfgallery' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/release.keystore"
          if [ -n "${KEYSTORE_BASE64_SECRET:-}" ]; then
            echo "Using signing keystore from GitHub Secret KEYSTORE_BASE64"
            printf '%s' "$KEYSTORE_BASE64_SECRET" | tr -d ' \t\r\n' | base64 -d > "$KS"
          elif [ -f signing/release-keystore.b64 ]; then
            echo "Using versioned signing keystore signing/release-keystore.b64"
            tr -d ' \t\r\n' < signing/release-keystore.b64 | base64 -d > "$KS"
          else
            echo "::error::No signing keystore found (set secret KEYSTORE_BASE64 or provide signing/release-keystore.b64)"
            exit 1
          fi
          chmod 600 "$KS"
          keytool -list -v \
            -keystore "$KS" \
            -storetype "$KEYSTORE_TYPE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "Alias name:|Owner:|Valid from:|SHA256:|SHA1:|Signature algorithm name:" \
            | tee "$RUNNER_TEMP/cert.txt"
          echo "keystore_file=$KS" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ steps.ks.outputs.keystore_file }}
          KEYSTORE_TYPE: ${{ secrets.KEYSTORE_TYPE || 'PKCS12' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'PdfGalleryHasib2026!Key' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pdfgallery' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'PdfGalleryHasib2026!Key' }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 \
            | tee "$RUNNER_TEMP/build.log"
          ls -lh app/build/outputs/apk/release/

      - name: Report build failure
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          echo "=== Tail of Gradle build log ==="
          tail -100 "$LOG" || true
          python3 - "$LOG" <<'PY'
          import pathlib, sys
          txt = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          idx = txt.find("FAILURE: Build failed")
          snippet = txt[idx:idx+8000] if idx >= 0 else txt[-8000:]
          esc = snippet.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for i in range(0, min(len(esc), 6400), 800):
              print(f"::error title=gradle-failure-{i//800}::{esc[i:i+800]}")
          PY
          {
            echo "### ❌ Gradle build failure"
            echo '```'
            tail -100 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK signature & prepare assets
        id: apk
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner \( -type f -o -type l \) | sort -V | tail -1)"
          AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 \( -type f -o -type l \) | sort -V | tail -1 || true)"

          SRC="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -1)"
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::Signed release APK not found in app/build/outputs/apk/release/"
            exit 1
          fi

          VERSIONED_APK="PDF-Gallery-v${VERSION_NAME}-release.apk"
          LATEST_APK="PDF-Gallery-release.apk"
          cp "$SRC" "$VERSIONED_APK"
          cp "$SRC" "$LATEST_APK"

          echo "=== apksigner verification ==="
          "$APKSIGNER" verify --verbose --print-certs "$VERSIONED_APK" | tee "$RUNNER_TEMP/signer.txt"
          grep -q "^Verifies" "$RUNNER_TEMP/signer.txt"

          if [ -n "$AAPT2" ] && [ -x "$AAPT2" ]; then
            echo "=== APK package badging ==="
            "$AAPT2" dump badging "$VERSIONED_APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|native-code:)" | tee "$RUNNER_TEMP/badging.txt" || true
          fi

          sha256sum "$VERSIONED_APK" "$LATEST_APK" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          python3 - "$VERSIONED_APK" "$LATEST_APK" "$RUNNER_TEMP/signer.txt" <<'PY'
          import hashlib, os, pathlib, re, sys

          apk_path = pathlib.Path(sys.argv[1])
          latest_name = sys.argv[2]
          signer = pathlib.Path(sys.argv[3]).read_text(errors="replace")

          size_bytes = apk_path.stat().st_size
          size_mib = f"{size_bytes / (1024 * 1024):.2f} MiB"
          size_mb = f"{size_bytes / 1_000_000:.2f} MB"
          apk_sha256 = hashlib.sha256(apk_path.read_bytes()).hexdigest()

          def colon_hex(h):
              h = h.upper()
              return ":".join(h[i:i+2] for i in range(0, len(h), 2)) if h else ""

          m256 = re.search(r'SHA-256 digest:\s*([0-9a-fA-F]{64})', signer) or re.search(r'\b([0-9a-fA-F]{64})\b', signer)
          m1 = re.search(r'SHA-1 digest:\s*([0-9a-fA-F]{40})', signer) or re.search(r'\b([0-9a-fA-F]{40})\b', signer)
          mdn = re.search(r'certificate DN:\s*(.+)', signer)

          cert_sha256 = colon_hex(m256.group(1)) if m256 else ""
          cert_sha1 = colon_hex(m1.group(1)) if m1 else ""
          cert_dn = mdn.group(1).strip() if mdn else ""

          schemes = []
          for label, pat in [("v1", r"v1 scheme[^:]*:\s*true"), ("v2", r"v2 scheme[^:]*:\s*true"), ("v3", r"v3 scheme[^:]*:\s*true")]:
              if re.search(pat, signer, re.IGNORECASE):
                  schemes.append(label)
          schemes_str = " + ".join(schemes) if schemes else "v1 + v2 + v3"

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"versioned_apk={apk_path.name}\n")
              out.write(f"latest_apk={latest_name}\n")
              out.write(f"bytes={size_bytes}\n")
              out.write(f"size_mib={size_mib}\n")
              out.write(f"size_mb={size_mb}\n")
              out.write(f"sha256={apk_sha256}\n")
              out.write(f"cert_sha256={cert_sha256}\n")
              out.write(f"cert_sha1={cert_sha1}\n")
              out.write(f"cert_dn={cert_dn}\n")
              out.write(f"schemes={schemes_str}\n")

          print(
              f"::notice title=apk-verified::file={apk_path.name} | bytes={size_bytes} | "
              f"size={size_mib} ({size_mb}) | sha256={apk_sha256} | schemes={schemes_str} | "
              f"cert_sha256={cert_sha256} | cert_sha1={cert_sha1}"
          )
          PY

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Gallery-v${{ steps.meta.outputs.version_name }}-release-apk
          path: |
            PDF-Gallery-v*-release.apk
            PDF-Gallery-release.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: >-
          github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_dispatch' || inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ID: ${{ steps.meta.outputs.app_id }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          MIN_SDK: ${{ steps.meta.outputs.min_sdk }}
          TARGET_SDK: ${{ steps.meta.outputs.target_sdk }}
          VERSIONED_APK: ${{ steps.apk.outputs.versioned_apk }}
          LATEST_APK: ${{ steps.apk.outputs.latest_apk }}
          SIZE_MIB: ${{ steps.apk.outputs.size_mib }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
          BYTES: ${{ steps.apk.outputs.bytes }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          CERT_SHA256: ${{ steps.apk.outputs.cert_sha256 }}
          CERT_SHA1: ${{ steps.apk.outputs.cert_sha1 }}
          CERT_DN: ${{ steps.apk.outputs.cert_dn }}
          SCHEMES: ${{ steps.apk.outputs.schemes }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION_NAME}"
          fi
          TITLE="PDF Gallery v${VERSION_NAME} (Signed Release APK)"
          BUILT_AT="$(date -u '+%d %b %Y, %H:%M UTC')"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## 📕 PDF Gallery v${VERSION_NAME}

          **Kotlin + Jetpack Compose (Material Design 3)** দিয়ে তৈরি সাইন করা রিলিজ APK — GitHub Actions-এ স্বয়ংক্রিয়ভাবে বিল্ড ও ভেরিফাই করা হয়েছে।

          ### ⬇️ ডাউনলোড

          | ফাইল | সাইজ | বিবরণ |
          | --- | --- | --- |
          | **\`${VERSIONED_APK}\`** | **${SIZE_MIB}** (${SIZE_MB}) | সাইন করা রিলিজ APK — সাধারণ ব্যবহারের জন্য (এটাই ইনস্টল করুন) |
          | \`${LATEST_APK}\` | ${SIZE_MIB} | একই সাইন করা APK (স্থায়ী \`latest\` ডাউনলোড লিংকের জন্য) |
          | \`SHA256SUMS.txt\` | — | ফাইলের অখণ্ডতা যাচাইয়ের SHA-256 চেকসাম |

          ### 📋 বিল্ড তথ্য

          | বিষয় | তথ্য |
          | --- | --- |
          | **ভার্সন** | \`${VERSION_NAME}\` (\`versionCode ${VERSION_CODE}\`) |
          | **প্যাকেজ আইডি** | \`${APP_ID}\` |
          | **আর্কিটেকচার (ABI)** | Universal (সব Android ডিভাইস সাপোর্টেড) |
          | **Android সংস্করণ** | Android 7.0+ (\`minSdk ${MIN_SDK}\` → \`targetSdk ${TARGET_SDK}\`) |
          | **সাইজ** | ${SIZE_MIB} (${BYTES} bytes) |
          | **সাইনিং স্কিম** | APK Signature Scheme **${SCHEMES}** (\`RSA 2048\` / \`SHA256withRSA\`) |
          | **বিল্ড সময়** | ${BUILT_AT} |
          | **কমিট ও রান** | \`${SHORT_SHA}\` · Build #${GITHUB_RUN_NUMBER} |

          ### ✨ v${VERSION_NAME}-এর প্রধান ফিচারসমূহ
          - 🎨 **সম্পূর্ণ নতুন Jetpack Compose (Material 3) UI** — লাইট, ডার্ক ও সিস্টেম থিম সাপোর্ট
          - 🗂️ **হোম লাইব্রেরি ও ফোল্ডার ম্যানেজার** — ডিভাইসের সব PDF অটো-স্ক্যান, কাস্টম ফোল্ডার, মাল্টি-সিলেক্ট মুভ, ফেভারিট, সার্চ, PDF কমপ্রেস, হোম-স্ক্রিন শর্টকাট ও পূর্ণ JSON ব্যাকআপ/রিস্টোর
          - ☁️ **Google Drive ও URL PDF ডাউনলোডার** — লিংক বা Share মেনু থেকে সরাসরি ইমপোর্ট, অটো ক্লিপবোর্ড পেস্ট, Drive টাইটেল/কভার সংগ্রহ, ব্যাকগ্রাউন্ড Pause/Resume ডাউনলোড ও কাস্টম কভার ছবি
          - 📖 **হাই-প্রিসিশন PDF ভিউয়ার** — মসৃণ ভার্টিক্যাল স্ক্রলিং, পিঞ্চ-জুম, ডাবল-ট্যাপ জুম, ডান পাশের ফাস্ট-স্ক্রল বার ও সরাসরি পেজ জাম্প
          - ✂️ **পেজ ক্রপ ও লসলেস স্নিপেট** — Invert ও B&W ফিল্টার, ট্রান্সপারেন্ট ইঙ্ক এক্সট্রাকশন, গ্যালারিতে সেভ এবং কাস্টম প্রম্পটসহ AI-তে সরাসরি শেয়ার
          - 🔍 **Google Lens ও স্ক্রিন স্নিপেট ওভারলে** — ভাসমান Prev/Next/Note পেজ নেভিগেটর বার, Accessibility অটো-কপি হেল্পার, ML Kit OCR ফলব্যাক ও স্ক্রিন স্নিপেট ক্যাপচার
          - 📝 **আনলিমিটেড নোট ও ২-কলাম চ্যাপ্টার ইনডেক্স** — Noto Serif Bengali ফন্টে বাংলা ও ইংরেজি নোট, Undo/Redo, KaTeX গণিত/বিজ্ঞান ফর্মুলা প্রিভিউ, ক্লিকযোগ্য \`(পৃষ্ঠা= N)\` পেজ লিংক এবং \`.txt\` এক্সপোর্ট

          ### 🔐 সাইনিং সার্টিফিকেট (সব ভবিষ্যৎ আপডেটে একই)
          \`\`\`text
          Subject (DN) : ${CERT_DN}
          SHA-256      : ${CERT_SHA256}
          SHA-1        : ${CERT_SHA1}
          \`\`\`

          ### ✅ চেকসাম ও সিগনেচার যাচাই
          \`\`\`bash
          sha256sum ${VERSIONED_APK}
          # ${SHA256}

          apksigner verify --print-certs ${VERSIONED_APK}
          \`\`\`

          ### 📲 ইনস্টল ও আপডেট নির্দেশনা
          1. উপরের **\`${VERSIONED_APK}\`** ফাইলটি ডাউনলোড করুন।
          2. ফাইলটিতে ট্যাপ করুন এবং প্রয়োজনে **Install unknown apps** অনুমতি দিন।
          3. **Install** চাপুন। একই সাইনিং সার্টিফিকেট ও প্যাকেজ আইডি (\`${APP_ID}\`) থাকায় পরবর্তী সব ভার্সন আনইনস্টল ছাড়াই সরাসরি আপডেট হবে।
          4. *(দ্রষ্টব্য: যদি আগে ভিন্ন প্যাকেজ বা অস্থায়ী debug কী-তে বিল্ড করা পুরোনো APK ইনস্টল থাকে, শুধু প্রথমবার সেটি সরিয়ে এই সাইনড v${VERSION_NAME} ইনস্টল করুন।)*

          > Play Protect সতর্কতা দেখালে **More details → Install anyway** চাপুন (APK-টি স্ব-স্বাক্ষরিত, Play Store-এর বাইরের রিলিজ)।

          🤖 Built automatically by [GitHub Actions](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" "$VERSIONED_APK" "$LATEST_APK" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease=false \
              --draft=false \
              --latest \
              -R "$GITHUB_REPOSITORY"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "$VERSIONED_APK" "$LATEST_APK" SHA256SUMS.txt \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA" \
              --latest \
              -R "$GITHUB_REPOSITORY"
          fi

      - name: Job summary
        run: |
          {
            echo "## ✅ PDF Gallery v${{ steps.meta.outputs.version_name }} — Signed APK Ready"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Package ID** | \`${{ steps.meta.outputs.app_id }}\` |"
            echo "| **Version** | \`${{ steps.meta.outputs.version_name }}\` (\`versionCode ${{ steps.meta.outputs.version_code }}\`) |"
            echo "| **Release APK** | \`${{ steps.apk.outputs.versioned_apk }}\` |"
            echo "| **Size** | ${{ steps.apk.outputs.size_mib }} (${{ steps.apk.outputs.bytes }} bytes) |"
            echo "| **Signature Schemes** | ${{ steps.apk.outputs.schemes }} |"
            echo "| **Cert SHA-256** | \`${{ steps.apk.outputs.cert_sha256 }}\` |"
            echo "| **APK SHA-256** | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| **Release URL** | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${{ steps.meta.outputs.version_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
